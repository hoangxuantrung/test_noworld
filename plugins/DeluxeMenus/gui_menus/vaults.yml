menu_title: '&8Kho Đồ Cá Nhân'
open_command:
  - vault
  - vaults
  - pv
  - kho
size: 9

open_requirement:
  requirements:
    permission:
      type: has permission
      permission: deluxemenus.open
      deny_commands:
        - "[message] &cBạn không có quyền mở menu này!"

items:
  # ================= VAULT 1 (MIỄN PHÍ) =================
  'Vault_1':
    material: BARREL
    slot: 0
    display_name: "&e&lKHO ĐỒ 1"
    lore:
      - "&7Mở kho đồ số 1"
      - "&a&lMIỄN PHÍ"
    click_commands:
      - '[player] axvault 1'
      - '[close]'

  # ================= VAULT 2 (10,000$) =================
  'Vault_2_Unlocked':
    material: BARREL
    slot: 1
    priority: 1
    view_requirement:
      requirements:
        has_perm:
          type: has permission
          permission: axvaults.vault.2
    display_name: "&e&lKHO ĐỒ 2"
    lore:
      - "&7Mở kho đồ số 2"
      - "&a&lĐÃ SỞ HỮU"
    click_commands:
      - '[player] axvault 2'
      - '[close]'

  'Vault_2_Locked':
    material: BARRIER
    slot: 1
    priority: 2
    display_name: "&c&lKHO ĐỒ 2 &7(Khóa)"
    lore:
      - "&7Mở khóa vĩnh viễn Kho đồ số 2"
      - "&eGiá: &a10,000$"
      - "&b[Nhấp để mua]"
    click_requirement:
      requirements:
        has_money:
          type: has money
          amount: 10000
      deny_commands:
        - '[message] &cBạn không đủ 10,000$ để mở khóa Kho đồ 2!'
        - '[close]'
    click_commands:
      - '[console] eco take %player_name% 10000'
      - '[console] lp user %player_name% permission set axvaults.vault.2'
      - '[message] &a&lThành công! &fBạn đã mở khóa &eKho đồ 2&f.'
      - '[close]'

