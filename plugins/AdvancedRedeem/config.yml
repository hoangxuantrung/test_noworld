# Placeholders:
# %player% - Player name
# %code% - Used code
# %initial_uses% - Maximum number of uses

language: EN # Language (EN, CZ, DE, FR)

ip_tracking_enabled: false # A maximum of one code usage per given IP address.

automatic-code-deletion: false # Automatic deletion of codes after reaching their maximum usage.

codes:
  examplecode: # Code
    uses: 10 # Remaining number of uses
    initial_uses: 10 # Maximum number of uses - To set the code to unlimited, use the maximum number of uses as "0".
    commands:
    - minecraft:give %player% diamond 1
    - say Thank you for downloading this plugin. I would appreciate a positive review.
      :)
  UNSMARTVN:
    uses: 0
    initial_uses: 0
    commands:
    - eco give %player% 100000
    - shards give %player% 1000
  UPDATE_UNSMARTVN_066:
    uses: 99969
    initial_uses: 0
    commands:
    - eco give %player% 100000
    - shards give %player% 1000
    - title %player% title {"text":"§fBạn đã đổi mã thành công!","bold":true}
