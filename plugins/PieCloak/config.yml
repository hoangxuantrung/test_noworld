enabled: true

worlds:
  include: []
  exclude: []

blockEntities:
  enabled: true
  revealRadius: 7            # still supported if losMode=false
  remaskWhenLeaving: true
  losMode: true               # <<< NEW: gate by line-of-sight instead of radius
  maxRevealDistance: 120      # <<< NEW: cap for LOS checks (~render distance)
  placeholders:
    CHEST: CRAFTING_TABLE
    TRAPPED_CHEST: CRAFTING_TABLE
    BARREL: OAK_PLANKS
    ENDER_CHEST: OBSIDIAN
    HOPPER: POLISHED_ANDESITE
    FURNACE: STONE
    BLAST_FURNACE: STONE
    SMOKER: STONE
    LECTERN: OAK_PLANKS
    SPAWNER: DEEPSLATE
    JUKEBOX: OAK_PLANKS
    BREWING_STAND: COBBLESTONE
    CAMPFIRE: COBBLESTONE
    SOUL_CAMPFIRE: COBBLESTONE
    BEE_NEST: OAK_PLANKS
    BEEHIVE: OAK_PLANKS
    COMPOSTER: OAK_PLANKS
    CARTOGRAPHY_TABLE: OAK_PLANKS
    SMITHING_TABLE: OAK_PLANKS
    STONECUTTER: STONE
    ENCHANTING_TABLE: OBSIDIAN
    BELL: GOLD_BLOCK
  maskMaterials:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - ENDER_CHEST
    - HOPPER
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - LECTERN
    - SPAWNER
    - JUKEBOX
    - BREWING_STAND
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - BEE_NEST
    - BEEHIVE
    - COMPOSTER
    - CARTOGRAPHY_TABLE
    - SMITHING_TABLE
    - STONECUTTER
    - ENCHANTING_TABLE
    - BELL

entities:
  enabled: true
  # revealRadius is ignored when losStrict=true; we keep it for legacy
  revealRadius: 12
  losAssist: true             # keep; harmless when losStrict=true
  losStrict: true             # <<< NEW: only show if viewer has LOS
  maxRevealDistance: 120      # <<< NEW: cap for entity LOS checks
  suppressTypes:
    - VILLAGER
    - IRON_GOLEM
    - ARMOR_STAND
    - ALLAY
    - COW
    - SHEEP
    - CHICKEN
    - PIG
    - CAMEL
    - HORSE
    - MULE
    - DONKEY
    - LLAMA
    - RABBIT
    - CAT
    - TURTLE
    - AXOLOTL
    - SNIFFER
    - ALLAY
    - ARMADILLO

tpsGuard:
  enabled: true
  minTps: 18.5

permissions:
  bypass: "piecloak.bypass"

debug:
  verbose: false
