# PlaceholderAPI
# Version: 2.12.3
# Created by: extended_clip
# Contributors: https://github.com/PlaceholderAPI/PlaceholderAPI/graphs/contributors
# Issues: https://github.com/PlaceholderAPI/PlaceholderAPI/issues
# Expansions: https://placeholderapi.com/ecloud
# Wiki: https://wiki.placeholderapi.com/
# Discord: https://helpch.at/discord
# If you're seeing performance issues with plugins that use component replacement, or things don't look quite right,
# switch to the replacer provided by adventure itself by changing use_adventure_provided_replacer to true
# No placeholders are provided with this plugin by default.
# Download placeholders: /papi ecloud
check_updates: true
cloud_enabled: true
cloud_sorting: name
boolean:
  'true': 'yes'
  'false': 'no'
date_format: MM/dd/yy HH:mm:ss
detect_malicious_expansions: true
use_adventure_provided_replacer: false
debug: false
expansions:
  vault:
    formatting:
      thousands: k
      millions: M
      billions: B
      trillions: T
      quadrillions: Q
  simpleclans:
    color:
      ally: '&b'
      same_clan: '&a'
      rival: '&c'
  playerstats:
    update_interval_in_seconds:
      distance_statistics: 1
      time_statistics: 1
    display:
      max_time_unit: day
      min_time_unit: second
      distance_unit: blocks
      damage_unit: hearts
      processing_message_color: '#ADE7FF'
      only_player_name_color: ''
      only_stat_number_color: ''
  math:
    Disable-Warnings: false
    Rounding: half-up
    Decimals: 3
    Debug: false
  player:
    ping_value:
      high: 100
      medium: 50
    direction:
      north: N
      south: S
      north_west: NW
      north_east: NE
      east: E
      south_east: SE
      west: W
      south_west: SW
    ping_color:
      medium: '&e'
      high: '&c'
      low: '&a'
